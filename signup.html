<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký Khoản Vay | VAYNHANH+</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        --primary-teal: #009688;
        --primary-teal-hover: #00796b;
        --dark-bg: #0b1116;
        --accent-orange: #ff8f00;
        --accent-orange-hover: #e67e00;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--dark-bg) 0%, #16242f 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .auth-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 550px;
        overflow: hidden;
        border: none;
      }
      .auth-header {
        background: linear-gradient(135deg, #1a2a36 0%, var(--dark-bg) 100%);
        padding: 25px;
        text-align: center;
        border-bottom: 3px solid var(--primary-teal);
      }
      .auth-brand {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--accent-orange);
        text-decoration: none;
        letter-spacing: 1px;
      }
      .auth-body {
        padding: 35px 40px;
      }
      .form-control,
      .form-select {
        border-radius: 8px;
        padding: 11px 15px;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        font-size: 0.95rem;
        transition: all 0.3s ease;
      }
      .form-control:focus,
      .form-select:focus {
        background-color: #fff;
        border-color: var(--primary-teal);
        box-shadow: 0 0 0 4px rgba(0, 150, 136, 0.15);
      }
      .input-group-text {
        background-color: #f8fafc;
        border-color: #e2e8f0;
        color: #64748b;
        border-radius: 8px 0 0 8px;
      }
      .btn-orange {
        background-color: var(--accent-orange);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
      }
      .btn-orange:hover {
        background-color: var(--accent-orange-hover);
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 143, 0, 0.3);
      }
      .switch-auth-link {
        color: var(--primary-teal);
        text-decoration: none;
        font-weight: 600;
      }
      .switch-auth-link:hover {
        color: var(--primary-teal-hover);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <i class="bi bi-lightning-charge-fill me-1"></i>VAYNHANH+
        </a>
        <p class="text-muted small mb-0 mt-1 text-uppercase tracking-wider">
          Đăng ký hồ sơ trực tuyến siêu tốc
        </p>
      </div>
      <div class="auth-body">
        <h4 class="fw-bold text-dark mb-4 text-center">
          Đăng Ký Thành Viên Mới
        </h4>

        <form action="signin.html" method="GET">
          <!-- Họ và tên -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"
              >Họ và tên chính chủ</label
            >
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control"
                placeholder="Ví dụ: Nguyễn Văn A"
                required
              />
            </div>
          </div>

          <!-- Số điện thoại -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"
              >Số điện thoại di động</label
            >
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-telephone"></i
              ></span>
              <input
                type="tel"
                class="form-control"
                placeholder="Ví dụ: 0912345678"
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"
              >Địa chỉ Email</label
            >
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-envelope"></i
              ></span>
              <input
                type="email"
                class="form-control"
                placeholder="Ví dụ: nva@gmail.com"
                required
              />
            </div>
          </div>

          <!-- Lý do vay (Dropdown lựa chọn) -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"
              >Lý do nhu cầu vay tiền</label
            >
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-question-circle"></i
              ></span>
              <select class="form-select" required>
                <option value="" disabled selected hidden>
                  -- Chọn lý do vay tiêu dùng --
                </option>
                <option value="1">Vay tiêu dùng sinh hoạt hàng ngày</option>
                <option value="2">Đóng học phí / Chi phí học tập</option>
                <option value="3">Mua sắm đồ điện tử / Xe máy công việc</option>
                <option value="4">
                  Chi trả hóa đơn y tế, sức khỏe khẩn cấp
                </option>
                <option value="5">Kinh doanh nhỏ / Nhập hàng hóa</option>
                <option value="6">Các nhu cầu cá nhân cấp bách khác</option>
              </select>
            </div>
          </div>

          <!-- Mật khẩu mới -->
          <div class="mb-4">
            <label class="form-label small fw-bold text-secondary"
              >Tạo mật khẩu tài khoản</label
            >
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                placeholder="Tối thiểu 6 ký tự"
                required
              />
            </div>
          </div>

          <!-- Điều khoản cam kết -->
          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="terms"
              checked
              required
            />
            <label class="form-check-input-label small text-muted" for="terms">
              Tôi cam kết thông tin cung cấp hoàn toàn chính xác và đồng ý với
              điều khoản sử dụng.
            </label>
          </div>

          <!-- Nút Đăng ký -->
          <button type="submit" class="btn btn-orange w-100 mb-4 shadow-sm">
            ĐĂNG KÝ NGAY <i class="bi bi-arrow-right-circle ms-2"></i>
          </button>
        </form>

        <!-- Quay về đăng nhập -->
        <div class="text-center small text-muted">
          Đã có tài khoản thành viên?
          <a href="signin.html" class="switch-auth-link">Đăng nhập</a>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
