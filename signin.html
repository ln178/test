<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập | VAYNHANH+</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        --primary-teal: #009688;
        --primary-teal-hover: #00796b;
        --dark-bg: #0b1116;
        --accent-orange: #ff8f00;
        --accent-orange-hover: #e67e00;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--dark-bg) 0%, #16242f 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .auth-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
        overflow: hidden;
        border: none;
      }
      .auth-header {
        background: linear-gradient(135deg, #1a2a36 0%, var(--dark-bg) 100%);
        padding: 30px;
        text-align: center;
        border-bottom: 3px solid var(--primary-teal);
      }
      .auth-brand {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--accent-orange);
        text-decoration: none;
        letter-spacing: 1px;
      }
      .auth-body {
        padding: 40px 35px;
      }
      .form-control {
        border-radius: 8px;
        padding: 12px 15px;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        font-size: 0.95rem;
        transition: all 0.3s ease;
      }
      .form-control:focus {
        background-color: #fff;
        border-color: var(--primary-teal);
        box-shadow: 0 0 0 4px rgba(0, 150, 136, 0.15);
      }
      .input-group-text {
        background-color: #f8fafc;
        border-color: #e2e8f0;
        color: #64748b;
        border-radius: 8px 0 0 8px;
      }
      .btn-teal {
        background-color: var(--primary-teal);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
      }
      .btn-teal:hover {
        background-color: var(--primary-teal-hover);
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(0, 150, 136, 0.2);
      }
      .switch-auth-link {
        color: var(--primary-teal);
        text-decoration: none;
        font-weight: 600;
      }
      .switch-auth-link:hover {
        color: var(--primary-teal-hover);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card auth-card animate__animated animate__fadeIn">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <i class="bi bi-lightning-charge-fill me-1"></i>VAYNHANH+
        </a>
        <p class="text-muted small mb-0 mt-1 text-uppercase tracking-wider">
          Hệ thống vay trực tuyến 24/7
        </p>
      </div>
      <div class="auth-body">
        <h4 class="fw-bold text-dark mb-4 text-center">Đăng Nhập Tài Khoản</h4>

        <form action="index.html" method="GET">
          <!-- Số điện thoại -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"
              >Số điện thoại di động</label
            >
            <div class="input-group">
              <span class="input-group-text"
                ><i class="bi bi-telephone"></i
              ></span>
              <input
                type="tel"
                class="form-control"
                placeholder="Nhập số điện thoại của bạn"
                required
              />
            </div>
          </div>

          <!-- Mật khẩu -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-bold text-secondary mb-0"
                >Mật khẩu</label
              >
              <a href="#" class="small text-muted text-decoration-none"
                >Quên mật khẩu?</a
              >
            </div>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                placeholder="Nhập mật khẩu"
                required
              />
            </div>
          </div>

          <!-- Ghi nhớ đăng nhập -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" />
            <label
              class="form-check-input-label small text-muted"
              for="rememberMe"
            >
              Ghi nhớ đăng nhập trên thiết bị này
            </label>
          </div>

          <!-- Nút Đăng nhập -->
          <button type="submit" class="btn btn-teal w-100 mb-4 shadow-sm">
            ĐĂNG NHẬP <i class="bi bi-box-arrow-in-right ms-2"></i>
          </button>
        </form>

        <!-- Chuyển hướng qua file đăng ký -->
        <div class="text-center small text-muted">
          Bạn chưa có tài khoản?
          <a href="signup.html" class="switch-auth-link">Đăng ký ngay</a>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
