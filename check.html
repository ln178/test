<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm Tra Hóa Đơn | VAYNHANH+</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        --primary-teal: #009688;
        --primary-teal-hover: #00796b;
        --dark-bg: #0b1116;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--dark-bg) 0%, #16242f 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .check-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 480px;
        padding: 40px 30px;
        text-align: center;
      }
      .icon-box {
        font-size: 3.5rem;
        color: #ff9800;
        margin-bottom: 20px;
      }
      .btn-teal {
        background-color: var(--primary-teal);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-teal:hover {
        background-color: var(--primary-teal-hover);
        color: white;
        box-shadow: 0 4px 12px rgba(0, 150, 136, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="check-card">
      <div class="icon-box">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>

      <h4 class="fw-bold text-dark mb-3">Yêu Cầu Đăng Nhập</h4>
      <p class="text-muted mb-4">
        Vui lòng đăng nhập tài khoản thành viên để có thể kiểm tra và tra cứu
        hóa đơn khoản vay của bạn.
      </p>

      <a href="signin.html" class="btn btn-teal w-100 mb-3 shadow-sm">
        ĐĂNG NHẬP NGAY <i class="bi bi-box-arrow-in-right ms-2"></i>
      </a>

      <a href="index.html" class="small text-secondary text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Quay về trang chủ
      </a>
    </div>
  </body>
</html>
